<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --canvas:#f6f7fb; --surface:#fff; --ink:#071530; --muted:#646b80; --line:#e5e7ef; --brand:#002fa7; --accent:#3d6bff; --soft:#e8eeff; --code:#c7d2fe; --ok:#86efac; --cyan:#67e8f9; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body { position:relative; background:var(--canvas); font-family:Geist, system-ui, sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:48px 48px; -webkit-mask-image:radial-gradient(70% 90% at 30% 40%, #000, transparent); }
  .glow { position:absolute; right:-160px; top:-200px; width:720px; height:720px; background:radial-gradient(closest-side, rgb(61 107 255 / .28), transparent); }
  .wrap { position:absolute; inset:64px 72px; display:flex; flex-direction:column; }
  .logo { display:flex; align-items:center; gap:14px; font-size:34px; font-weight:700; letter-spacing:-.02em; }
  .logo i { width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg, var(--brand), var(--accent)); }
  .eyebrow { margin-top:auto; font-family:'Geist Mono', monospace; font-size:22px; color:var(--brand); letter-spacing:.02em; }
  h1 { margin-top:14px; max-width:15ch; font-size:76px; line-height:1; font-weight:600; letter-spacing:-.045em; }
  h1 span { background:linear-gradient(135deg, var(--brand), var(--accent)); -webkit-background-clip:text; color:transparent; }
  p { margin-top:22px; max-width:40ch; font-size:26px; line-height:1.4; color:var(--muted); }
  .foot { margin-top:34px; display:flex; align-items:center; gap:10px; }
  .tag { border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:7px 14px; font-family:'Geist Mono', monospace; font-size:18px; font-weight:500; }
  .url { margin-left:auto; font-family:'Geist Mono', monospace; font-size:20px; color:var(--muted); }
  .term { position:absolute; right:72px; top:64px; width:360px; border-radius:16px; background:var(--ink); padding:22px 24px; font-family:'Geist Mono', monospace; font-size:17px; line-height:1.8; color:var(--code); box-shadow:0 30px 70px -30px rgb(7 21 48 / .55); }
  .term .dots { display:flex; gap:7px; margin-bottom:12px; } .term .dots i { width:11px; height:11px; border-radius:50%; background:#2a3557; }
  .term b { font-weight:400; color:var(--cyan); } .term em { font-style:normal; color:var(--ok); }
  body.square .term { display:none; }
</style>
</head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="term"><div class="dots"><i></i><i></i><i></i></div><b>$</b> git push origin main<br><em>✓</em> build passed · 42s<br><em>✓</em> tests 128/128<br><em>✓</em> deployed → <b id="host">dirait.com</b></div>
<div class="wrap">
  <div class="logo"><i></i>dirait</div>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="foot" id="tags"></div>
</div>
<script>
  // Card text comes from the query string so one template renders every page's image.
  const q = new URLSearchParams(location.search);
  document.getElementById('eyebrow').textContent = q.get('eyebrow') || 'CUSTOM SOFTWARE · JAKARTA';
  document.getElementById('title').innerHTML = (q.get('title') || 'The software team your operations *run on.*').replace(/\*(.+?)\*/g, '<span>$1</span>');
  document.getElementById('sub').textContent = q.get('sub') || 'Web, mobile, IoT and AI systems — designed, built, deployed and monitored by one team.';
  const tags = document.getElementById('tags');
  (q.get('tags') || 'Web,Mobile,IoT,AI,DevOps').split(',').forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tags.append(s); });
  const url = document.createElement('span'); url.className = 'url'; url.textContent = q.get('url') || 'dirait.com'; tags.append(url);
</script>
</body>
</html>
