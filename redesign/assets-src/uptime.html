<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.main{left:24px;top:30px;width:592px;height:290px;padding:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.lbl{font-size:13px;color:var(--mid);display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;font:500 11.5px var(--mono);padding:3px 9px;border-radius:99px}.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.big{font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:1;margin-top:8px;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;gap:4px;background:#f4f5f9;border-radius:9px;padding:3px;font-size:12px}.seg span{padding:5px 10px;border-radius:7px;color:var(--mid)}.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.bars{display:flex;gap:4px;height:44px;margin-top:22px}.bars i{flex:1;border-radius:4px;background:var(--ok)}.bars i.w{background:#fbbf24}.bars i.d{background:#f87171}
.ax{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mid);margin-top:8px}
svg.sp{width:100%;height:70px;margin-top:14px}
.mini{width:184px;padding:14px 16px}
.mini .lbl{font-size:12px}.mini b{display:block;font-size:24px;letter-spacing:-.03em;margin-top:4px}.mini em{font-style:normal;font-size:12px;color:#16a34a}
.reg{display:flex;gap:6px;margin-top:8px}.reg span{font:500 11px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:flex;gap:5px;align-items:center}.reg span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
</style></head><body><div class="stage">
<div class="glow" style="width:300px;height:160px;left:160px;top:320px;background:#8fb0ff"></div>
<div class="card main">
  <div class="top"><div><div class="lbl">Uptime · all services <span class="live">LIVE</span></div><div class="big">99.98%</div></div>
    <div class="seg"><span>24h</span><span class="on">30d</span><span>90d</span></div></div>
  <div class="bars" id="bars"></div>
  <div class="ax"><span>30 days ago</span><span>2 incidents · 14 min total</span><span>today</span></div>
  <svg class="sp" viewBox="0 0 548 70" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#002fa7" stop-opacity=".25"/><stop offset="1" stop-color="#002fa7" stop-opacity="0"/></linearGradient></defs>
    <path d="M0 44 C30 40 50 50 80 42 S140 30 170 38 230 46 260 34 320 28 350 36 410 22 440 30 500 26 548 20 V70 H0Z" fill="url(#g)"/>
    <path d="M0 44 C30 40 50 50 80 42 S140 30 170 38 230 46 260 34 320 28 350 36 410 22 440 30 500 26 548 20" fill="none" stroke="#002fa7" stroke-width="2"/></svg>
</div>
<div class="card mini" style="left:24px;top:340px"><div class="lbl"><i data-lucide="gauge"></i>Avg response</div><b>182 ms</b><em>▼ 12% this week</em></div>
<div class="card mini" style="left:228px;top:340px"><div class="lbl"><i data-lucide="shield-check"></i>Incidents / 24h</div><b>0</b><em>all checks passing</em></div>
<div class="card mini" style="left:432px;top:340px"><div class="lbl"><i data-lucide="globe"></i>Regions</div><div class="reg"><span>ID</span><span>SG</span><span>EU</span></div></div>
</div>
<script>const b=document.getElementById('bars');for(let i=0;i<40;i++){const e=document.createElement('i');if(i==11)e.className='w';if(i==27)e.className='d';b.appendChild(e)}</script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons()</script></body></html>
